name: Build and release Android (apk)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build apk and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run android build script
        run: yarn build-android
      
      - name: Rename apk
        run: mv android/app/build/outputs/apk/release/app-release.apk idea-mixer.apk
      
      - name: Create a tag
        id: tag
        run: |
          # Use date, short SHA as tag
          DATE=$(date +%Y%m%d)
          TAG="$DATE-${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
      
      - name: Create Github release and upload apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: idea-mixer.apk
          token: ${{ secrets.GITHUB_TOKEN }}